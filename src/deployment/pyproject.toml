# Deployment tool: deploys model-service, api-service and frontend to Cloud Run, and the whole app to GKE. uv.lock pins the versions.
[project]
name = "greenpath-deployment"
version = "0.1.0"
description = "GreenPath deployment: prepare the model, deploy and test the services on Cloud Run, or the whole app on GKE"
requires-python = ">=3.12,<3.15"
dependencies = [
    "google-cloud-run>=0.10,<1",   # create and update Cloud Run services and who may call them
    "google-auth>=2.40.0",
    "gcsfs>=2025.1,<2027",         # read the model and its predictions from the bucket
    "pandas>=2.2,<3",
    "pyarrow>=19,<24",
    "requests>=2.32,<3",           # live tests
    "pulumi==3.272.0",             # Kubernetes: the Pulumi programs (same versions as the tutorial)
    "pulumi-docker-build==0.0.22", # deploy_images builds and pushes the images
    "pulumi-gcp==10.2.0",          # the static IP, the network and the GKE cluster
]

[dependency-groups]
dev = ["pytest>=9.0.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# The API: reads the ride with Gemini, plans the routes, and sends the cells to model-service in batches.
# Nothing is kept between requests, so either copy can answer any request.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-service # deploy-k8s.sh adds the Workload Identity annotation; deploy_k8s binds this name
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
data:
  MODEL_SERVICE_URL: http://model-service:8080 # plain http inside the cluster: no Cloud Run ID token needed
  MODEL_MAX_CONCURRENCY: "4" # batches sent at once by each copy: one per model pod
  RAG_SERVICE_URL: http://rag-service:8001
  LLM_PROVIDER: gemini
  GEMINI_MODEL: gemini-3.1-flash-lite
  GEMINI_LOCATION: global
  GREENPATH_DATASET: 1026_Full_data
  # deploy-k8s.sh fills these in for your project
  GCP_PROJECT: ""
  GREENPATH_BUCKET: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
  labels: { app: api-service }
spec:
  # Fixed: the model pods, not the API, set the speed. Two copies, so one crash is never an outage.
  replicas: 2
  selector:
    matchLabels: { app: api-service } # the glue: the Service uses the same label
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } # a new pod is ready before an old one leaves
  template:
    metadata:
      labels: { app: api-service }
    spec:
      serviceAccountName: api-service
      containers:
        - name: api-service
          image: greenpath-api-service # pinned to the pushed image by deploy-k8s.sh
          ports: [{ name: http, containerPort: 9000 }]
          envFrom:
            - configMapRef: { name: api-config }
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { memory: 2Gi } # the same memory as on Cloud Run
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-service # the name the frontend calls: http://api-service:9000
spec:
  selector: { app: api-service }
  ports: [{ name: http, port: 9000, targetPort: http }]

# RAG: answers questions about a route from the knowledge in Chroma (vector-db.yaml), with Gemini.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rag-service # deploy-k8s.sh adds the Workload Identity annotation; deploy_k8s binds this name
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-config
data:
  CHROMADB_HOST: vector-db
  CHROMADB_PORT: "8000"
  GCP_LOCATION: global
  GENERATIVE_MODEL: gemini-3.1-flash-lite
  RAG_GENERATOR: base
  RAG_CHUNK_TYPE: markdown-split
  ANONYMIZED_TELEMETRY: "false"
  GCP_PROJECT: "" # deploy-k8s.sh fills it in for your project
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-service
  labels: { app: rag-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: rag-service } # the glue: the Service uses the same label
  template:
    metadata:
      labels: { app: rag-service }
    spec:
      serviceAccountName: rag-service
      containers:
        - name: rag-service
          image: greenpath-rag-service # pinned to the pushed image by deploy-k8s.sh
          ports: [{ name: http, containerPort: 8001 }]
          envFrom:
            - configMapRef: { name: rag-config }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 1Gi } # the same memory as on Cloud Run
          readinessProbe: # no traffic until Chroma answers
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: rag-service # the name the API calls: http://rag-service:8001
spec:
  selector: { app: rag-service }
  ports: [{ name: http, port: 8001, targetPort: http }]

# One public entrance: a Google global external load balancer, made from these objects by GKE's
# Gateway controller. It answers on the static IP from deploy_base and sends every request to the
# frontend, which forwards /api/* to the API itself.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: greenpath
spec:
  gatewayClassName: gke-l7-global-external-managed
  addresses:
    - type: NamedAddress
      value: greenpath-gateway-ip # the static IP's name in deploy_base
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: greenpath
spec:
  parentRefs:
    - name: greenpath
      sectionName: http
  rules:
    - backendRefs: [{ name: frontend, port: 3000 }]
---
# The load balancer runs its own health check, separate from the kubelet's probes: GET / on the frontend
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: frontend
spec:
  default:
    checkIntervalSec: 5
    timeoutSec: 3
    config:
      type: HTTP
      httpHealthCheck: { requestPath: / }
  targetRef: { group: "", kind: Service, name: frontend }
---
# Planning routes over a whole area can take minutes: set the load balancer's timeout to the API's
# 15 minutes rather than rely on its 30 s default. A pod that is shutting down finishes its answers first.
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: frontend
spec:
  default:
    timeoutSec: 900
    connectionDraining: { drainingTimeoutSec: 60 }
  targetRef: { group: "", kind: Service, name: frontend }

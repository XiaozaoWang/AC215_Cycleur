# PIPELINE DEFINITION
# Name: model-training
components:
  comp-model-training:
    executorLabel: exec-model-training
    inputDefinitions:
      parameters:
        bucket_name:
          defaultValue: ''
          isOptional: true
          parameterType: STRING
        dry_run:
          defaultValue: true
          isOptional: true
          parameterType: BOOLEAN
        location:
          defaultValue: ''
          isOptional: true
          parameterType: STRING
        project:
          defaultValue: ''
          isOptional: true
          parameterType: STRING
        service_account:
          defaultValue: ''
          isOptional: true
          parameterType: STRING
        training_id:
          defaultValue: ''
          isOptional: true
          parameterType: STRING
deploymentSpec:
  executors:
    exec-model-training:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - model_training
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'google-cloud-aiplatform'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.18.2'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef model_training(\n    project: str = \"\",\n    location: str\
          \ = \"\",\n    bucket_name: str = \"\",\n    training_id: str = \"\",\n\
          \    dry_run: bool = True,\n    service_account: str = \"\",\n):\n    print(\"\
          Model Training Job\")\n\n    # A Python component function runs on its own\
          \ in another container, so the libraries it uses have to be imported inside\
          \ the function\n    import time\n    from google.cloud import aiplatform_v1\
          \ as v1\n\n    # Training machine image: the CPU dry run uses the scikit-learn\
          \ image (torch gets installed at startup); real training uses the PyTorch\
          \ GPU image + one T4\n    cpu_image = \"us-docker.pkg.dev/vertex-ai/training/sklearn-cpu.1-6:latest\"\
          \n    gpu_image = \"us-docker.pkg.dev/vertex-ai/training/pytorch-gpu.2-4.py310:latest\"\
          \n    machine = v1.MachineSpec(machine_type=\"n1-standard-4\")\n    if not\
          \ dry_run:\n        machine = v1.MachineSpec(machine_type=\"n1-standard-4\"\
          , accelerator_type=v1.AcceleratorType.NVIDIA_TESLA_T4, accelerator_count=1)\n\
          \n    # Args for trainer.task: read training/<training_id>/, write results/<training_id>/{dry|final}/\n\
          \    args = [f\"--bucket={bucket_name}\", f\"--training-id={training_id}\"\
          , \"--dry-run\" if dry_run else \"--no-dry-run\"]\n\n    # One training\
          \ job = one machine + image + code package + running python -m trainer.task\
          \ with the args at startup\n    spec = v1.WorkerPoolSpec(\n        machine_spec=machine,\n\
          \        replica_count=1,\n        python_package_spec=v1.PythonPackageSpec(\n\
          \            executor_image_uri=cpu_image if dry_run else gpu_image,\n \
          \           package_uris=[f\"gs://{bucket_name}/trainer/greenpath-trainer.tar.gz\"\
          ],\n            python_module=\"trainer.task\",\n            args=args,\n\
          \            # Only resource identifiers go into the job spec; the trainer\
          \ retrieves the key.\n            env=[\n                v1.EnvVar(name=\"\
          GOOGLE_CLOUD_PROJECT\", value=project),\n                v1.EnvVar(name=\"\
          WANDB_SECRET_ID\", value=\"wandb-api-key\"),\n            ],\n        ),\n\
          \    )\n    client = v1.JobServiceClient(client_options={\"api_endpoint\"\
          : f\"{location}-aiplatform.googleapis.com\"})\n    job = client.create_custom_job(\n\
          \        parent=f\"projects/{project}/locations/{location}\",\n        custom_job=v1.CustomJob(display_name=\"\
          greenpath-training\",\n                                job_spec=v1.CustomJobSpec(worker_pool_specs=[spec],\
          \ service_account=service_account)),\n    )\n    print(\"Custom job:\",\
          \ job.name, \"args:\", args, flush=True)\n\n    # Wait for training to end:\
          \ check the state every 30 seconds, print it when it changes (shows up in\
          \ this step's logs on the pipeline page)\n    done = (v1.JobState.JOB_STATE_SUCCEEDED,\
          \ v1.JobState.JOB_STATE_FAILED, v1.JobState.JOB_STATE_CANCELLED, v1.JobState.JOB_STATE_EXPIRED)\n\
          \    last = None\n    while job.state not in done:\n        time.sleep(30)\n\
          \        job = client.get_custom_job(name=job.name)\n        if job.state\
          \ != last:\n            print(\"State:\", job.state.name, flush=True)\n\
          \            last = job.state\n    if job.state != v1.JobState.JOB_STATE_SUCCEEDED:\n\
          \        raise RuntimeError(f\"Training job ended as {job.state.name}: {job.error.message}\"\
          )\n\n"
        env:
        - name: GOOGLE_CLOUD_PROJECT
          value: organic-victory-508017-v9
        image: python:3.12
pipelineInfo:
  name: model-training
root:
  dag:
    tasks:
      model-training:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-model-training
        inputs:
          parameters:
            bucket_name:
              runtimeValue:
                constant: ac215-notebook
            dry_run:
              runtimeValue:
                constant: true
            location:
              runtimeValue:
                constant: us-central1
            project:
              runtimeValue:
                constant: organic-victory-508017-v9
            service_account:
              runtimeValue:
                constant: greenpath-ml-workflow@organic-victory-508017-v9.iam.gserviceaccount.com
            training_id:
              runtimeValue:
                constant: Yue_20261108_test_collector
        taskInfo:
          name: Model Training
schemaVersion: 2.1.0
sdkVersion: kfp-2.18.2
